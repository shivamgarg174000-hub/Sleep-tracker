name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: cd sleep_tracker_app && flutter pub get

      - name: Build APK Release (Verbose Logging)
        working-directory: sleep_tracker_app
        run: flutter build apk --release --verbose > flutter-build-log.txt 2>&1

      - name: Upload full Flutter log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-full-log
          path: sleep_tracker_app/flutter-build-log.txt
