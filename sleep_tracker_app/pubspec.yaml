name: kitty_sleep
description: "Premium AI-powered sleep tracking and health companion."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- State Management ---
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # --- Firebase ---
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.1

  # --- Notifications ---
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # --- Health Integrations ---
  health: ^10.2.0                 # Wraps Health Connect (Android) + HealthKit (iOS)
  permission_handler: ^11.3.1

  # --- AI Integration ---
  dio: ^5.7.0                     # HTTP client for Claude/OpenAI API calls
  flutter_dotenv: ^5.1.0          # Keeps API keys out of source control

  # --- Background Audio ---
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  audio_service: ^0.18.15   # provides MediaItem used for lock-screen metadata
  audio_session: ^0.1.21

  # --- UI / Animation / Glassmorphism ---
  glassmorphism: ^3.0.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  fl_chart: ^0.69.0               # Gradient charts, sleep-stage timeline
  percent_indicator: ^4.2.3       # Smooth progress rings
  lottie: ^3.1.3
  shimmer: ^3.0.0

  # --- Haptics / Device ---
  flutter_haptic: any
  device_info_plus: ^10.0.0

  # --- Utilities ---
  intl: ^0.19.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  go_router: ^14.3.0
  flutter_secure_storage: ^9.2.2
  logger: ^2.4.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
